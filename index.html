<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- style -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="mainfont min-h-screen flex items-center justify-center">
    <section class="w-full max-w-lg bg-base-200 mx-auto bg-white py-8">
        <div class="title-image flex flex-col items-center justify-center">
            <img src="./asset/github-logo.png" alt="">
            <h2 class="font-semibold text-[24px]">GitHub Issues Tracker</h2>
            <p class="text-[#64748B]">Sign in to manage your issues</p>
        </div>
        <div class="card bg-base-100 w-full max-w-sm shrink-0 mx-auto">
            <div class="card-body">
                <fieldset class="fieldset">
                <label class="text-[16px] text-[#1F2937] font-medium">Username</label>
                <input id="userID" type="email" class="input" placeholder="Username" />
                <p class="text-[14px] text-[#4A00FF]">Default: admin</p>
                <label class="text-[16px] text-[#1F2937] font-medium">Password</label>
                <input id="pass" type="password" class="input" placeholder="Password" />
                <p class="text-[14px] text-[#4A00FF]">Default: admin123</p>
                <button onclick="login()" class="btn btn-primary mt-4">Sign In</button>
                </fieldset>
                <div class="flex items-center w-full gap-3">
                    <div class="flex-grow h-px bg-gray-300"></div>
                    <span class="text-gray-500 text-sm whitespace-nowrap">OR</span>
                    <div class="flex-grow h-px bg-gray-300"></div>
                </div>
                 <div class="demo text-center max-w-sm w-full shrink-0 mx-auto">
                    <p>Demo Credentials:</p>
                    <div class="bg-[#F8FAFC] py-6 rounded-lg">
                        <p><span class="font-bold">Username:</span> admin</p>
                        <p><span class="font-bold">Password:</span> admin123</p>
                    </div>
                 </div>
            </div>
        </div>
    </section>

    <script src="./index.js"></script>
</body>
</html>
