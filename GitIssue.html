<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Daisy -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- style -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="mainfont min-h-screen">

    <header>
        <div class="cont navbar bg-base-100 shadow-sm">
            <div class="w-[90%] max-w-[1440px] mx-auto flex justify-center md:justify-between flex-col md:flex-row items-center gap-2 md:gap-0">
            <div>
                <div class="flex items-center">
                    <img class="max-w-[32px]" src="./asset/github-logo.png" alt="">
                    <a class="btn btn-ghost text-xl">GitHub Issues Tracker</a>
                </div>
            </div>
            <div class="flex gap-2">
                
                <label class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke-width="2.5"
                    fill="none"
                    stroke="currentColor"
                    >
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input type="search" required placeholder="Search" />
                </label>
                <button class="btn btn-primary">+ New Issue</button>
                
            </div>
            </div>
            
        </div>
    </header>

    <section class="w-[90%] md:w-[70%] max-w-[1110px] mx-auto mt-3 md:mt-14">
        <div class="tabs bg-white p-2 md:p-6 gap-2 rounded-lg shadow-sm justify-center md:justify-start">
            <button onclick="loadAll_issues()" class="btn btn-primary btn-xs sm:btn-sm md:btn-md  w-[70px] md:w-[120px]">All</button>
            <button class="btn btn-primary btn-xs sm:btn-sm md:btn-md  w-[70px] md:w-[120px]">Open</button>
            <button class="btn btn-primary btn-xs sm:btn-sm md:btn-md  w-[70px] md:w-[120px]">Close</button>

        </div>
    </section>
    
    <section class="w-[90%] md:w-[70%] max-w-[1110px] mx-auto mt-3 md:mt-4">
        <div class="tabs bg-white p-3 md:p-6 gap-6 rounded-tr-lg rounded-tl-lg shadow-sm flex g-2 md:g-0 flex-col md:flex-row justify-between">
            <div class="left flex items-center justify-center gap-2">
                <img class=" border-[9px] border-[#ECE4FF] rounded-full" src="./asset/Aperture.png" alt="">
                <div class="text">
                    <h2 class="font-semibold text-[20px]"><span id="counter"></span> Issues</h2>
                    <p class="text-[#64748B] text-[16px]">Track and manage your project issues</p>
                </div>
            </div>
            <div class="right flex gap-4 items-center justify-center">
                <div class="open flex items-center justify-center gap-2">
                    <img src="./asset/green.png" alt="">
                    <p>Open</p>
                </div>
                <div class="open flex items-center justify-center gap-2">
                    <img src="./asset/purple.png" alt="">
                    <p>Closed</p>
                </div>
                
            </div>
        </div>
    </section>
    <section class="w-[90%] md:w-[70%] max-w-[1110px] mx-auto">
        <div id="issue_container" class="tabs bg-[#FBFBFB] p-3 md:p-6 gap-3 rounded-br-lg rounded-bl-lg shadow-sm grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
            <div class="card">
                <div class="top flex justify-between items-center">
                    <img src="${elem.status==='open'? './asset/Open-Status.png' :'./asset/Closed- Status .png'}" alt="">
                    <div>${elem.priority === 'high'? <div class="badge badge-soft badge-error">HIGH</div>: <div class="badge badge-soft badge-success">Success</div>}</div>
                </div>
                <id>id</id>
                <h2>Title</h2>
                <p>Description</p>
                <p>Status</p>
            </div>
        </div>
    </section>

</body>
</html>
